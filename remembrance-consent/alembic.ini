[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# URL comes from REMEMBRANCE_MIGRATION_DATABASE_URL (or REMEMBRANCE_DATABASE_URL);
# see migrations/env.py. Never put credentials in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
